apiVersion: v1
kind: Namespace
metadata:
  name: day49-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: day49-lab
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: day49-lab
  labels:
    app: client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep 36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: other
  namespace: day49-lab
  labels:
    app: other
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep 36000"]
