apiVersion: v1
kind: Namespace
metadata:
  name: day48-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-viewer
  namespace: day48-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: day48-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: day48-lab
subjects:
  - kind: ServiceAccount
    name: pod-viewer
    namespace: day48-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
