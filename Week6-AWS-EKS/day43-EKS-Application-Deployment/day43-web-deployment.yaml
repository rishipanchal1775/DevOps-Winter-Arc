apiVersion: apps/v1
kind: Deployment
metadata:
  name: day43-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: day43-web
  template:
    metadata:
      labels:
        app: day43-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
